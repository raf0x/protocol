workflows:
  ios-bootstrap:
    name: iOS project bootstrap
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: "22"
      xcode: latest
    # Start manually; generate and download the native project before signing.
    scripts:
      - name: Ensure no iOS project exists
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -e ios ] || [ -L ios ]; then
            echo "ios/ already exists. Bootstrap must not overwrite a native project." >&2
            exit 1
          fi
      - name: Install project dependencies
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npm ci
      - name: Verify Capacitor version
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npx cap --version
          npm ls @capacitor/cli @capacitor/core @capacitor/ios --depth=0
          node <<'NODE'
          const assert = require('node:assert/strict');
          for (const name of ['@capacitor/cli', '@capacitor/core', '@capacitor/ios']) {
            const { version } = require(`${name}/package.json`);
            assert.ok(version.startsWith('8.'), `${name} must use Capacitor 8; found ${version}`);
          }
          NODE
      - name: Generate native iOS project
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          npx cap add ios
      - name: Verify generated iOS project
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          test -d ios
          test -f ios/App/App.xcodeproj/project.pbxproj
          test -f ios/App/CapApp-SPM/Package.swift
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' ios/App/App/Info.plist)" = "MyPepProtocol"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' ios/App/App/Info.plist)" = '$(PRODUCT_BUNDLE_IDENTIFIER)'
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const project = fs.readFileSync('ios/App/App.xcodeproj/project.pbxproj', 'utf8');
          const bundleIds = [...project.matchAll(/PRODUCT_BUNDLE_IDENTIFIER\s*=\s*([^;]+);/g)]
            .map(match => match[1].trim().replace(/^"|"$/g, ''));
          assert.ok(bundleIds.length > 0, 'No Xcode bundle identifiers found');
          for (const bundleId of bundleIds) {
            assert.equal(bundleId, 'app.mypepprotocol', 'Unexpected Xcode bundle identifier');
          }
          const config = JSON.parse(fs.readFileSync('ios/App/App/capacitor.config.json', 'utf8'));
          assert.equal(config.appId, 'app.mypepprotocol');
          assert.equal(config.appName, 'MyPepProtocol');
          assert.equal(config.server.url, 'https://www.mypepprotocol.app');
          assert.equal(config.server.cleartext, false);
          console.log('Verified iOS project: app.mypepprotocol / MyPepProtocol');
          NODE
      - name: Package complete iOS project
        script: |
          #!/usr/bin/env bash
          set -euo pipefail
          zip -r ios-project.zip ios
          unzip -t ios-project.zip
    artifacts:
      - ios-project.zip
